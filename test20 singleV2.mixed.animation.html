function boxesOverlap(x0, y0, x1, y1) {
  // Check if two 80x100 boxes overlap
  // Box0: center (x0,y0), Box1: center (x1,y1)
  const left0 = x0 - HEAD_W/2, right0 = x0 + HEAD_W/2;
  const top0 = y0 - HEAD_FRONT, bottom0 = y0 + HEAD_D - HEAD_FRONT;
  const left1 = x1 - HEAD_W/2, right1 = x1 + HEAD_W/2;
  const top1 = y1 - HEAD_FRONT, bottom1 = y1 + HEAD_D - HEAD_FRONT;
  return left0 < right1 && right0 > left1 && top0 < bottom1 && bottom0 > top1;
}

  W = holder.clientWidth; H = holder.clientHeight;

  ctx.clearRect(0,0,W,H);

  for (let i=0;i<limit;i++) {
    const m = MOVES[i];
    const [px0,py0] = toPx(m.x0,m.y0);
    const [px1,py1] = toPx(m.x1,m.y1);
    if (!m.ex) {
      ctx.strokeStyle = 'rgba(120,120,120,0.25)';
      ctx.lineWidth = 1;
    } else {
      ctx.strokeStyle = toolColor(m.t);
      ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(px0,py0);
    ctx.lineTo(px1,py1);
    ctx.stroke();
  }
  if (limit>0) {
    const m = MOVES[limit-1];
    drawToolLocations(m.ln, m);
    drawHead(m.hx, m.hy, HEAD_COLORS[0], "0", [`Z:${m.z}`], false);
    drawHead(m.ux, m.uy, HEAD_COLORS[1], "1", [`D:${m.ud}`, `z:${m.gz}`], m.ud > 80);

    let marker = '';
    if (isOverlap) marker += ' ⚠️ OVERLAP';
    if (isIndxPrint) marker += ' 🖨️ INDX';
    info.textContent = `layer ${m.l+1} / ${LAYER_COUNT} · line ${m.ln} · overlaps: ${overlapIndices.length} · indx: ${indxPrintIndices.length}${marker}`;

    drawToolLocations(0, MOVES[0]);

  ctx.strokeStyle = color.stroke;
  ctx.lineWidth = 2;
  ctx.fillRect(px, py, w, h);
  if (dashed) {
    ctx.setLineDash([2, 3]);
  }
  ctx.strokeRect(px, py, w, h);
  ctx.setLineDash([]);
  const [nx, ny] = toPx(nozzleX, nozzleY);
  ctx.fillStyle = color.stroke;
  ctx.beginPath(); ctx.arc(nx, ny, 4, 0, 7); ctx.fill();
  ctx.font = '11px -apple-system,Helvetica,Arial,sans-serif';
  ctx.fillStyle = color.stroke;
  ctx.fillText(label, px + 4, py + 12);
  (extraLines || []).forEach((text, i) => {
    ctx.fillText(text, px + 4, py + 26 + i * 14);
  });
}

function getToolStates(currentLine) {
  // Track which tools are in which locations: { coord_key: 'rack' | 0 | 1 }
  // 'rack' = tool is in tool holder, 0/1 = tool is in that toolhead
  const toolStates = {};
  for (const coord of INDX_TOOL_HOLDER_LOCATIONS) {
    toolStates[JSON.stringify(coord)] = 'rack';  // start with all tools in rack
  }

  for (const [lineno, isOpen, head, coord] of INDX_OPEN_CLOSE_EVENTS) {
    if (lineno > currentLine) break;
    const key = JSON.stringify(coord);
    if (isOpen) {
      // Open = toolhead drops off tool back to rack
      toolStates[key] = 'rack';
    } else {
      // Close = toolhead picks up tool from rack
      toolStates[key] = head;
    }
  }
  return toolStates;
}

function drawToolLocations(currentLine, m) {
  // Draw 10mm circles showing where each tool is: in tool rack or in a toolhead
  if (!m) return;
  const toolStates = getToolStates(currentLine);
  const circleRadius = (10 / 2) * scale;  // 10mm diameter = 5mm radius
  ctx.lineWidth = 1.5;
  ctx.fillStyle = 'transparent';

  // Draw tools in their current locations
  for (const coord of INDX_TOOL_HOLDER_LOCATIONS) {
    const key = JSON.stringify(coord);
    const state = toolStates[key];

    let x, y, strokeColor;
    if (state === 'rack') {
      // Tool is in the rack
      x = coord[0];
      y = coord[1];
      strokeColor = '#999';  // grey in rack
    } else if (state === 0) {
      // Tool is in Gantry0
      x = m.hx;
      y = m.hy;
      strokeColor = '#55b8ff';  // blue in gantry0
    } else if (state === 1) {
      // Tool is in Gantry1
      x = m.ux;
      y = m.uy;
      strokeColor = '#ff9955';  // orange in gantry1
    } else {
      continue;
    }

    const [px, py] = toPx(x, y);
    ctx.strokeStyle = strokeColor;
    ctx.beginPath();
    ctx.arc(px, py, circleRadius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function tick() {
  if (playing) {
    idx += speed;
    if (idx >= MOVES.length) {
      idx = 0;
    }
    drawUpTo(idx);
  }
  requestAnimationFrame(tick);
}

function togglePlay() {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? 'Pause' : 'Play';
}

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('restartBtn').onclick = () => { idx = 0; playing = true; document.getElementById('playBtn').textContent='Pause'; drawUpTo(0); };
document.getElementById('speed').onchange = (e) => { speed = parseFloat(e.target.value); };
scrub.oninput = (e) => { idx = parseInt(e.target.value); playing = false; document.getElementById('playBtn').textContent='Play'; drawUpTo(idx); };

window.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    togglePlay();
    return;
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (specialPoints.length === 0) return;
    if (e.shiftKey) {
      // Backtab: previous special point
      specialIdx = (specialIdx - 1 + specialPoints.length) % specialPoints.length;
    } else {
      // Tab: next special point
      specialIdx = (specialIdx + 1) % specialPoints.length;
    }
    idx = specialPoints[specialIdx];
    playing = false;
    document.getElementById('playBtn').textContent = 'Play';
    drawUpTo(idx);
    return;
  }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  idx = Math.max(0, Math.min(MOVES.length, idx + (e.key === 'ArrowRight' ? 1 : -1)));
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  drawUpTo(idx);
});

window.addEventListener('resize', () => { resize(); drawUpTo(idx); });
resize();
drawUpTo(0);
requestAnimationFrame(tick);
</script>
