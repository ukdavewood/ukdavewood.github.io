<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>G-code Animation - test20 singleV2.temp.gcode</title>
<style>
  body { margin:0; background:#1e1e1e; color:#ddd; font-family:-apple-system,Helvetica,Arial,sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100vh; }
  #mainArea { display:flex; flex:1; min-height:0; }
  #canvasHolder { flex:1; position:relative; overflow:hidden; }
  canvas { position:absolute; top:0; left:0; }
  #paneResize { width:4px; background:#333; cursor:col-resize; user-select:none; transition:background 0.1s; }
  #paneResize:hover { background:#666; }
  #paneResize:active { background:#88ff00; }
  #gcodePane { flex:0 0 400px; display:flex; flex-direction:column; background:#1a1a1a; border-left:1px solid #333; overflow:hidden; }
  #gcodeToolbar { padding:8px; background:#252526; border-bottom:1px solid #333; display:flex; flex-direction:column; gap:6px; }
  #gcodeToolbar input { padding:4px 8px; background:#3a3d41; border:1px solid #555; color:#ddd; border-radius:3px; font-size:12px; width:100%; box-sizing:border-box; }
  #gcodeToolbar input:focus { outline:none; border-color:#88ff00; box-shadow:0 0 4px rgba(136,255,0,0.3); }
  #gcodeToolbar input::placeholder { color:#666; }
  #gcodeContent { flex:1; overflow-y:auto; overflow-x:auto; margin:0; padding:8px; font-family:'Monaco','Courier New',monospace; font-size:12px; color:#aaa; line-height:1.4; white-space:pre; }
  #gcodeContent.wrap { overflow-x:hidden; }
  #gcodeContent.wrap .gcode-line { white-space:pre-wrap; }
  .gcode-line { padding:0 4px; margin:0; display:block; }
  .gcode-line.current { background:rgba(100,200,255,0.3); font-weight:bold; }
  .gcode-line.match { background:rgba(255,200,0,0.2); }
  .gcode-line.match.current { background:rgba(100,255,150,0.3); }
  .gcode-line.breakpoint { background:rgba(255,80,80,0.12); }
  .gcode-line.breakpoint.current { background:rgba(255,120,120,0.28); }
  /* Syntax highlighting */
  .tok-ln { color:#666; cursor:pointer; user-select:none; }
  .tok-ln:hover { color:#fff; }
  .gcode-line.breakpoint .tok-ln { color:#fff; background:#e04545; border-radius:2px; }
  .tok-cmd { color:#4ec9b0; }
  .tok-tool { color:#dcdcaa; font-weight:bold; }
  .tok-xyz { color:#9cdcfe; }
  .tok-uvd { color:#ffb86c; }
  .tok-e { color:#c586c0; }
  .tok-aux { color:#808080; }
  .tok-comment { color:#6a9955; font-style:italic; }
  #gcodeToolbar .row { display:flex; align-items:center; gap:8px; }
  #gcodeToolbar select { padding:4px; background:#3a3d41; border:1px solid #555; color:#ddd; border-radius:3px; font-size:12px; flex:1; min-width:0; }
  #gcodeToolbar .row label { font-size:12px; display:flex; align-items:center; gap:4px; white-space:nowrap; cursor:pointer; }
  #controls { padding:10px 16px; background:#252526; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  button { background:#3a3d41; color:#fff; border:1px solid #555; border-radius:4px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#4a4d51; }
  input[type=range] { flex:1; min-width:200px; }
  label { font-size:13px; white-space:nowrap; }
  #info { font-size:13px; min-width:170px; }
  select { background:#3a3d41; color:#fff; border:1px solid #555; border-radius:4px; padding:4px; }
</style>
</head>

  <div id="controls">

        <option value="20">20x</option>
        <option value="60">60x</option>

        <option value="1" selected>Real-time</option>
        <option value="10">10&times;</option>
        <option value="100">100&times;</option>
      </select>
    </label>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <span id="info">layer 0 / 0 &middot; line 0</span>
  </div>
</div>

// Limit violations: [move_index, axis, value, limit_min, limit_max, line_number]

const FILAMENT_COLORS = [];
function toolColor(t) {
  if (FILAMENT_COLORS[t]) return FILAMENT_COLORS[t];
  return FALLBACK_COLORS[t % FALLBACK_COLORS.length];
}

// Printhead footprint: 80mm wide (X) x 100mm deep (Y), nozzle centered in X
// and 5mm back from the front edge (front = lower-Y side of the rectangle).
const HEAD_W = 80, HEAD_D = 100, HEAD_FRONT = 5;
const GANTRY_LEFT = -40, GANTRY_RIGHT = 340, GANTRY_D = 40;  // X gantry: fixed position, 380mm wide, 40mm deep
const HEAD_COLORS = [
  { stroke: "#55b8ff", fill: "rgba(85,184,255,0.12)", label: "Trident (X/Y)" },
  { stroke: "#ff9955", fill: "rgba(255,153,85,0.12)", label: "2.4 gantry (U/V)" },
];

function boxesOverlap(x0, y0, x1, y1) {
  // Check if two 80x100 boxes overlap
  // Box0: center (x0,y0), Box1: center (x1,y1)
  const left0 = x0 - HEAD_W/2, right0 = x0 + HEAD_W/2;
  const top0 = y0 - HEAD_FRONT, bottom0 = y0 + HEAD_D - HEAD_FRONT;
  const left1 = x1 - HEAD_W/2, right1 = x1 + HEAD_W/2;
  const top1 = y1 - HEAD_FRONT, bottom1 = y1 + HEAD_D - HEAD_FRONT;
  return left0 < right1 && right0 > left1 && top0 < bottom1 && bottom0 > top1;
}

const overlapIndices = [];
for (let i = 0; i < MOVES.length; i++) {
  const m = MOVES[i];
  if (m.ud < 0 && boxesOverlap(m.hx, m.hy, m.ux, m.uy)) {
    overlapIndices.push(i);
  }
}

// Find move indices for INDX print lines
// INDX print comments are on lines without moves, so find the first move AFTER each INDX line
const indxPrintIndices = [];
for (const lineno of INDX_PRINT_LINES) {
  for (let i = 0; i < MOVES.length; i++) {
    if (MOVES[i].ln > lineno) {
      indxPrintIndices.push(i);
      break;

  }
}

const limitViolationIndices = new Set();
const limitViolationDetails = {};  // move_index -> [{axis, val, lo, hi, ln}]
for (const [mi, axis, val, lo, hi, ln] of LIMIT_VIOLATIONS) {

}).sort((a, b) => a - b);

      if (here.length) {
        marker += ' 🚫 LIMIT(' + here.map(d => {
          if (d.val < d.lo) return `${d.axis}=${d.val}<min${d.lo}`;
          return `${d.axis}=${d.val}>max${d.hi}`;
        }).join(',') + ')';
      }
      if (other) marker += ` +${other} on nearby lines`;
    }
    const infoText = `layer ${m.l+1} / ${LAYER_COUNT} · line ${m.ln} · overlaps: ${overlapIndices.length} · limits: ${limitViolationList.length} · indx: ${indxPrintIndices.length}${marker}`;
    drawDecorations({x:m.hx, y:m.hy, z:m.z, te:m.te0, ex:m.head===0&&m.ex, ed:m.head===0?m.ed:0}, {x:m.ux, y:m.uy, d:m.ud, gz:m.gz, te:m.te1, ex:m.head===1&&m.ex, ed:m.head===1?m.ed:0}, m.w, m.ln, infoText);
    syncGcodePane(m.ln);
  } else {
    // No moves drawn yet - show initial state
    info.textContent = `layer 0 / ${LAYER_COUNT} · line 0 · overlaps: ${overlapIndices.length} · limits: ${limitViolationList.length} · indx: ${indxPrintIndices.length}`;
  }
  scrub.value = limit;
}

// Draw both gantries, heads, tool-rack circles and the info bar for a given
// pair of head positions. Shared by line-based and time-based rendering.
function drawDecorations(h0, h1, wPos, currentLine, infoText) {
  drawGantry(h0.x, h0.y, HEAD_COLORS[0]);
  drawGantry(h1.x, h1.y, HEAD_COLORS[1]);
  drawToolLocations(currentLine, {hx:h0.x, hy:h0.y, ux:h1.x, uy:h1.y});
  drawHead(h0.x, h0.y, HEAD_COLORS[0], "0", [`Z:${h0.z}`, `W:${wPos}`, `E:${h0.te}mm`], false);
  drawHead(h1.x, h1.y, HEAD_COLORS[1], "1", [`D:${h1.d}`, `z:${h1.gz}`, `E:${h1.te}mm`], h1.d > 80);
  info.textContent = infoText;
}

// Time-based render: draw every move whose absolute start time <= T, and
// place each head at the latest move of its own gantry (they run in parallel).
// A move still in flight (T within [ta, ta+td]) is interpolated, so the head
// slides along the segment instead of jumping endpoint-to-endpoint.
function drawUpToTime(T) {
  ctx.clearRect(0,0,W,H);
  ctx.lineCap = 'round';
  let h0 = null, h1 = null, lastMove = null, lastIdx = -1;
  for (let i=0;i<MOVES.length;i++) {
    const m = MOVES[i];
    if (m.ta > T) continue;
    // Fraction of this move completed at time T (1 = finished/idle)
    const inFlight = m.td > 0 && T < m.ta + m.td;
    const f = inFlight ? (T - m.ta) / m.td : 1;
    const ex = m.x0 + (m.x1 - m.x0) * f;
    const ey = m.y0 + (m.y1 - m.y0) * f;
    const [px0,py0] = toPx(m.x0,m.y0);
    const [px1,py1] = toPx(ex,ey);
    if (!m.ex) { ctx.strokeStyle = 'rgba(120,120,120,0.25)'; ctx.lineWidth = 1; }
    else { ctx.strokeStyle = toolColor(m.t); ctx.lineWidth = 2; }
    ctx.beginPath(); ctx.moveTo(px0,py0); ctx.lineTo(px1,py1); ctx.stroke();
    // Head sits at the interpolated tip (axis values use the move's end state)
    if (m.head === 0) h0 = {x:ex, y:ey, z:m.z, te:m.te0, ex:inFlight&&m.ex, ed:m.ed};
    else h1 = {x:ex, y:ey, d:m.ud, gz:m.gz, te:m.te1, ex:inFlight&&m.ex, ed:m.ed};
    if (!lastMove || m.ta >= lastMove.ta) { lastMove = m; lastIdx = i; }
  }
  const def0 = MOVES[0];
  const H0 = h0 || {x:def0.hx, y:def0.hy, z:def0.z, te:0, ex:false, ed:0};
  const H1 = h1 || {x:def0.ux, y:def0.uy, d:def0.ud, gz:def0.gz, te:0, ex:false, ed:0};
  const currentLine = lastMove ? lastMove.ln : MOVES[0].ln;
  let marker = '';
  if (lastIdx >= 0 && overlapIndices.includes(lastIdx)) marker += ' ⚠️ OVERLAP';
  if (lastIdx >= 0 && indxPrintIndices.includes(lastIdx)) marker += ' 🖨️ INDX';
  if (lastIdx >= 0 && limitViolationIndices.has(lastIdx)) {
    const dets = limitViolationDetails[lastIdx];
    const here = dets.filter(d => d.ln === currentLine);
    const other = dets.length - here.length;
    if (here.length) {
      marker += ' 🚫 LIMIT(' + here.map(d => {
        if (d.val < d.lo) return `${d.axis}=${d.val}<min${d.lo}`;
        return `${d.axis}=${d.val}>max${d.hi}`;
      }).join(',') + ')';
    }
    if (other) marker += ` +${other} on nearby lines`;
  }
  const wPos = lastMove ? lastMove.w : 0;
  const infoText = `t ${T.toFixed(1)}s / ${TOTAL_TIME.toFixed(1)}s · line ${currentLine} · limits: ${limitViolationList.length} · layer ${lastMove ? lastMove.l+1 : 0} / ${LAYER_COUNT}${marker}`;
  drawDecorations(H0, H1, wPos, currentLine, infoText);
  if (lastMove) syncGcodePane(currentLine);
  scrub.value = Math.round(T * 100);
}

function drawGantry(nozzleX, nozzleY, color) {
  // X gantry: 380mm wide at fixed position (X=-40 to X=340), 40mm deep
  // Gantry occupies the back 40mm of the 100mm deep printhead box
  const front = nozzleY - HEAD_FRONT;  // front of printhead
  const back = front + HEAD_D;  // back edge of printhead (nozzleY + 95)
  const gantryFront = back - GANTRY_D;  // gantry front (inside printhead depth)
  const [px, py] = toPx(GANTRY_LEFT, back); // top-left in screen space (at back edge)
  const w = (GANTRY_RIGHT - GANTRY_LEFT) * scale;
  const h = GANTRY_D * scale;
  ctx.fillStyle = color.fill;
  ctx.strokeStyle = color.stroke;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.3;
  ctx.fillRect(px, py, w, h);
  ctx.strokeRect(px, py, w, h);
  ctx.globalAlpha = 1;
}

function drawHead(nozzleX, nozzleY, color, label, extraLines, dashed) {
  const left = nozzleX - HEAD_W/2;
  const front = nozzleY - HEAD_FRONT;
  const [px, py] = toPx(left, front + HEAD_D);
  const w = HEAD_W * scale, h = HEAD_D * scale;
  ctx.fillStyle = color.fill;
  ctx.strokeStyle = color.stroke;
  ctx.lineWidth = 2;
  ctx.fillRect(px, py, w, h);
  if (dashed) { ctx.setLineDash([2, 3]); }
  ctx.strokeRect(px, py, w, h);
  ctx.setLineDash([]);
  const [nx, ny] = toPx(nozzleX, nozzleY);
  ctx.fillStyle = color.stroke;
  ctx.beginPath(); ctx.arc(nx, ny, 4, 0, 7); ctx.fill();
  ctx.font = '11px -apple-system,Helvetica,Arial,sans-serif';
  ctx.fillStyle = color.stroke;
  ctx.fillText(label, px + 4, py + 12);
  (extraLines || []).forEach((text, i) => {
    ctx.fillText(text, px + 4, py + 26 + i * 14);
  });
}

function getToolStates(currentLine) {
  // Track which tools are in which locations: { coord_key: 'rack' | 0 | 1 }
  // 'rack' = tool is in tool holder, 0/1 = tool is in that toolhead
  const toolStates = {};
  for (const coord of INDX_TOOL_HOLDER_LOCATIONS) {
    toolStates[JSON.stringify(coord)] = 'rack';  // start with all tools in rack
  }

  for (const [lineno, isOpen, head, coord] of INDX_OPEN_CLOSE_EVENTS) {
    if (lineno > currentLine) break;
    const key = JSON.stringify(coord);
    if (isOpen) {
      // Open = toolhead drops off tool back to rack
      toolStates[key] = 'rack';
    } else {
      // Close = toolhead picks up tool from rack
      toolStates[key] = head;
    }
  }
  return toolStates;
}

function drawToolLocations(currentLine, m) {
  // Draw 10mm circles showing where each tool is: in tool rack or in a toolhead
  if (!m) return;
  const toolStates = getToolStates(currentLine);
  const circleRadius = (10 / 2) * scale;  // 10mm diameter = 5mm radius
  ctx.lineWidth = 1.5;
  ctx.fillStyle = 'transparent';

  // Draw tools in their current locations
  for (const coord of INDX_TOOL_HOLDER_LOCATIONS) {
    const key = JSON.stringify(coord);
    const state = toolStates[key];

    let x, y, strokeColor;
    if (state === 'rack') {
      // Tool is in the rack
      x = coord[0];
      y = coord[1];
      strokeColor = '#999';  // grey in rack
    } else if (state === 0) {
      // Tool is in Gantry0
      x = m.hx;
      y = m.hy;
      strokeColor = '#55b8ff';  // blue in gantry0
    } else if (state === 1) {
      // Tool is in Gantry1
      x = m.ux;
      y = m.uy;
      strokeColor = '#ff9955';  // orange in gantry1
    } else {
      continue;
    }

    const [px, py] = toPx(x, y);
    ctx.strokeStyle = strokeColor;
    ctx.beginPath();
    ctx.arc(px, py, circleRadius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function pause() { playing = false; document.getElementById('playBtn').textContent = 'Play'; }

function tick(now) {
  if (playing) {
    if (mode === 'line') {
      const prev = Math.floor(idx);
      idx += speed;
      // Pause if a breakpoint move became current this frame.
      // drawUpTo(idx) makes MOVES[idx-1] current, so the moves newly made
      // current span indices [prev, floor(idx)-1].
      if (breakpointMoveIndices.size) {
        for (let i = prev; i <= Math.floor(idx) - 1 && i < MOVES.length; i++) {
          if (breakpointMoveIndices.has(i)) { idx = i + 1; pause(); break; }
        }
      }
      if (idx >= MOVES.length) idx = 0;
      drawUpTo(idx);
    } else {
      // Time mode: advance the sim clock by real elapsed time x scale
      if (lastFrameMs == null) lastFrameMs = now;
      const prevT = simTime;
      simTime += ((now - lastFrameMs) / 1000) * timeScale;
      lastFrameMs = now;
      // Pause if a breakpoint move's start time was crossed this frame
      if (breakpointMoveIndices.size) {
        for (const i of breakpointMoveIndices) {
          const ta = MOVES[i].ta;
          if (ta > prevT && ta <= simTime) { simTime = ta; pause(); break; }
        }
      }
      if (simTime >= TOTAL_TIME) simTime = 0;
      drawUpToTime(simTime);
    }
  } else {
    lastFrameMs = now;  // keep delta sane across pauses
  }
  requestAnimationFrame(tick);
}

function togglePlay() {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? 'Pause' : 'Play';
}

function setMode(newMode) {
  if (newMode === mode) return;
  if (newMode === 'time') {
    // Carry the current position over: current move -> its start time
    const m = MOVES[Math.min(MOVES.length, Math.max(1, Math.floor(idx))) - 1];
    simTime = m ? m.ta : 0;
    mode = 'time';
    document.getElementById('speedLabel').style.display = 'none';
    document.getElementById('timeSpeedLabel').style.display = '';
    scrub.max = Math.max(1, Math.ceil(TOTAL_TIME * 100));
    lastFrameMs = null;
    drawUpToTime(simTime);
  } else {
    // Carry over: current time -> first move that has started by then
    let j = MOVES.findIndex(mm => mm.ta >= simTime);
    if (j < 0) j = MOVES.length - 1;
    idx = j + 1;
    mode = 'line';
    document.getElementById('speedLabel').style.display = '';
    document.getElementById('timeSpeedLabel').style.display = 'none';
    scrub.max = MOVES.length;
    drawUpTo(idx);
  }
}

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('restartBtn').onclick = () => {
  playing = true; document.getElementById('playBtn').textContent = 'Pause';
  if (mode === 'line') { idx = 0; drawUpTo(0); }
  else { simTime = 0; lastFrameMs = null; drawUpToTime(0); }
};
document.getElementById('speed').onchange = (e) => { speed = parseFloat(e.target.value); };
document.getElementById('timeSpeed').onchange = (e) => { timeScale = parseFloat(e.target.value); };
document.getElementById('mode').onchange = (e) => { setMode(e.target.value); };
scrub.oninput = (e) => {
  pause();
  if (mode === 'line') { idx = parseInt(e.target.value); drawUpTo(idx); }
  else { simTime = parseInt(e.target.value) / 100; lastFrameMs = null; drawUpToTime(simTime); }
};

// G-code pane initialization and sync
let lastManualScrollTime = 0;
let lastProgrammaticScrollTime = 0;
let currentSearchQuery = '';
let currentFilterPattern = '';

// Breakpoints: gcode line numbers the user clicked, plus the move indices they map to
const breakpoints = new Set();
const breakpointMoveIndices = new Set();

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Wrap each G-code token in a coloured span. Comments are split off first so
// their contents are never mistaken for commands/axes.
function highlightGcode(code) {
  const ci = code.indexOf(';');
  let body = code, comment = '';
  if (ci >= 0) { body = code.slice(0, ci); comment = code.slice(ci); }
  body = escapeHtml(body).replace(
    /(T\d+)|([GM]\d+(?:\.\d+)?)|([XYZ])(-?\d*\.?\d+)|([UVD])(-?\d*\.?\d+)|(E)(-?\d*\.?\d+)|([FPSIJ])(-?\d*\.?\d+)/g,
    function(m, tool, cmd, xl, xn, ul, un, el, en, al, an) {
      if (tool) return '<span class="tok-tool">' + tool + '</span>';
      if (cmd)  return '<span class="tok-cmd">' + cmd + '</span>';
      if (xl)   return '<span class="tok-xyz">' + xl + xn + '</span>';
      if (ul)   return '<span class="tok-uvd">' + ul + un + '</span>';
      if (el)   return '<span class="tok-e">' + el + en + '</span>';
      if (al)   return '<span class="tok-aux">' + al + an + '</span>';
      return m;
    });
  if (comment) body += '<span class="tok-comment">' + escapeHtml(comment) + '</span>';
  return body;
}

// First move at or after a given gcode line number (-1 if none)
function moveIndexForLine(lineNum) {
  for (let i = 0; i < MOVES.length; i++) {
    if (MOVES[i].ln >= lineNum) return i;
  }
  return -1;
}

function recomputeBreakpointMoves() {
  breakpointMoveIndices.clear();
  for (const ln of breakpoints) {
    const mi = moveIndexForLine(ln);
    if (mi >= 0) breakpointMoveIndices.add(mi);
  }
}

function toggleBreakpoint(ln, lineDiv) {
  if (breakpoints.has(ln)) {
    breakpoints.delete(ln);
    lineDiv.classList.remove('breakpoint');
  } else {
    breakpoints.add(ln);
    lineDiv.classList.add('breakpoint');
  }
  recomputeBreakpointMoves();
}

function initGcodePane() {
  const gcodeContent = document.getElementById('gcodeContent');
  const searchField = document.getElementById('searchField');
  const filterField = document.getElementById('filterField');
  const paneResize = document.getElementById('paneResize');
  const gcodePane = document.getElementById('gcodePane');

  const jumpSelect = document.getElementById('jumpSelect');

  // Populate G-code lines with inline (clickable) line numbers + syntax highlighting,
  // and collect marker comments for the "Jump to…" dropdown.
  GCODE_LINES.forEach((line, idx) => {
    const lineNum = idx + 1;
    const div = document.createElement('div');
    div.className = 'gcode-line';
    div.dataset.line = lineNum;
    // Format: "4055: G1 X136.545 Y149.523..." (line-number span is the breakpoint toggle)
    div.innerHTML = '<span class="tok-ln">' + lineNum + ':</span> ' + highlightGcode(line);
    gcodeContent.appendChild(div);

    const trimmed = line.trim();
    if (trimmed.startsWith(';') && /LAYER_CHANGE|LAYER:|INDX|Prime Line|TYPE:/i.test(trimmed)) {
      let label = trimmed.replace(/^;+\s*/, '');
      if (label.length > 40) label = label.slice(0, 40) + '…';
      const opt = document.createElement('option');
      opt.value = lineNum;
      opt.textContent = 'L' + lineNum + ': ' + label;
      jumpSelect.appendChild(opt);
    }
  });

  // Click a line number to toggle a breakpoint (animation pauses there)
  gcodeContent.addEventListener('click', (e) => {
    if (!e.target.classList.contains('tok-ln')) return;
    const lineDiv = e.target.closest('.gcode-line');
    if (lineDiv) toggleBreakpoint(parseInt(lineDiv.dataset.line), lineDiv);
  });

  // Jump to a marker comment: pause and move the animation to that line
  jumpSelect.addEventListener('change', (e) => {
    const ln = parseInt(e.target.value);
    e.target.selectedIndex = 0;  // reset back to placeholder
    if (!ln) return;
    const mi = moveIndexForLine(ln);
    playing = false;
    document.getElementById('playBtn').textContent = 'Play';
    if (mi >= 0) { idx = mi + 1; drawUpTo(idx); }
    // Scroll the pane straight to the comment line itself
    const lineEl = document.querySelector('.gcode-line[data-line="' + ln + '"]');
    if (lineEl) {
      lastProgrammaticScrollTime = Date.now();
      lineEl.scrollIntoView({ behavior: 'auto', block: 'center' });
    }
  });

  // Wrap long lines toggle (persisted)
  const wrapToggle = document.getElementById('wrapToggle');
  if (localStorage.getItem('gcodeWrap') === '1') {
    wrapToggle.checked = true;
    gcodeContent.classList.add('wrap');
  }
  wrapToggle.addEventListener('change', () => {
    gcodeContent.classList.toggle('wrap', wrapToggle.checked);
    localStorage.setItem('gcodeWrap', wrapToggle.checked ? '1' : '0');
  });

  // Restore pane width from localStorage
  const savedWidth = localStorage.getItem('gcodePaneWidth');
  if (savedWidth) {
    gcodePane.style.flex = `0 0 ${savedWidth}px`;
  }

  // Track manual scrolling to avoid auto-sync conflicts.
  // Ignore scroll events that our own scrollIntoView() triggers, otherwise
  // each auto-sync would look like a manual scroll and block the next sync.
  gcodeContent.addEventListener('scroll', () => {
    if (Date.now() - lastProgrammaticScrollTime < 150) return;
    lastManualScrollTime = Date.now();
  });

  // Search field with match counter
  searchField.addEventListener('input', (e) => {
    currentSearchQuery = e.target.value.toLowerCase();
    updateGcodeDisplay();
    updateMatchCounter();
  });

  // Filter field with hide/show logic
  filterField.addEventListener('input', (e) => {
    currentFilterPattern = e.target.value.trim();
    updateGcodeDisplay();
    updateMatchCounter();
  });

  // Resizable pane with mouse drag
  let isResizing = false;
  paneResize.addEventListener('mousedown', (e) => {
    isResizing = true;
    const startX = e.clientX;
    const startWidth = gcodePane.offsetWidth;

    const handleMouseMove = (moveEvent) => {
      if (!isResizing) return;
      const delta = startX - moveEvent.clientX;
      const newWidth = startWidth + delta;
      if (newWidth > 200 && newWidth < 1000) {
        gcodePane.style.flex = `0 0 ${newWidth}px`;
        localStorage.setItem('gcodePaneWidth', newWidth);
      }
    };

    const handleMouseUp = () => {
      isResizing = false;
      document.removeEventListener('mousemove', handleMouseMove);
      document.removeEventListener('mouseup', handleMouseUp);
    };

    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);
  });

  // Keyboard shortcut: Ctrl+F for search (focus search field)
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
      e.preventDefault();
      searchField.focus();
      searchField.select();
    }
  });
}

function termMatches(text, term) {
  // If term contains *, treat as a glob: * matches any characters
  if (term.includes('*')) {
    const re = new RegExp(term.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*'));
    return re.test(text);
  }
  return text.includes(term);
}

function filterMatches(text, pattern) {
  if (!pattern) return true;
  // Comma-separated terms. Positives are OR'd (show if any match);
  // negatives (leading "!") are AND'd (hide if any match).
  // Use * as a wildcard within any term (e.g. "G1 * D" matches "G1 X250 D-46").
  const terms = pattern.split(',').map(t => t.trim()).filter(t => t.length > 0);
  if (terms.length === 0) return true;
  const positives = [], negatives = [];
  for (const t of terms) {
    if (t.startsWith('!')) { if (t.length > 1) negatives.push(t.substring(1)); }
    else positives.push(t);
  }
  // Hidden if it matches any negative term
  if (negatives.some(n => termMatches(text, n))) return false;
  // If positive terms exist, must match at least one
  if (positives.length > 0) return positives.some(p => termMatches(text, p));
  return true;
}

function updateGcodeDisplay() {
  const lines = document.querySelectorAll('#gcodeContent .gcode-line');
  lines.forEach(line => {
    // Get the original code part (after "lineNum: ")
    const fullText = line.textContent;
    const colonIndex = fullText.indexOf(': ');
    const codeText = colonIndex >= 0 ? fullText.substring(colonIndex + 2) : fullText;
    const lowerCodeText = codeText.toLowerCase();

    // Check search match
    const searchMatch = !currentSearchQuery || lowerCodeText.includes(currentSearchQuery);
    line.classList.toggle('match', searchMatch && currentSearchQuery);

    // Check filter
    const filterMatch = filterMatches(codeText, currentFilterPattern);
    line.style.display = filterMatch ? 'block' : 'none';

    // Combine classes for current + match
    if (line.classList.contains('current') && searchMatch && currentSearchQuery) {
      line.classList.add('match');
    }
  });
}

function updateMatchCounter() {
  const searchField = document.getElementById('searchField');
  const matches = document.querySelectorAll('.gcode-line.match').length;
  if (currentSearchQuery) {
    searchField.title = `${matches} matches`;
  }
}

function syncGcodePane(lineNumber) {
  // Only pause auto-sync if user recently scrolled (within 2 seconds)
  if (Date.now() - lastManualScrollTime < 2000) return;

  const lineElement = document.querySelector(`.gcode-line[data-line="${lineNumber}"]`);
  if (!lineElement) return;

  // Remove previous current highlight
  document.querySelectorAll('.gcode-line.current').forEach(el => el.classList.remove('current'));

  // Add current highlight to new line
  lineElement.classList.add('current');

  // Get the original code part for search match check
  const fullText = lineElement.textContent;
  const colonIndex = fullText.indexOf(': ');
  const codeText = colonIndex >= 0 ? fullText.substring(colonIndex + 2) : fullText;

  // Re-apply search match if needed
  if (currentSearchQuery && codeText.toLowerCase().includes(currentSearchQuery)) {
    lineElement.classList.add('match');
  }

  // Scroll into view only if line is visible (not hidden by filter)
  if (lineElement.style.display !== 'none') {
    const gcodeContent = document.getElementById('gcodeContent');
    const elementRect = lineElement.getBoundingClientRect();
    const containerRect = gcodeContent.getBoundingClientRect();

    // Only scroll if element is not already visible
    if (elementRect.top < containerRect.top || elementRect.bottom > containerRect.bottom) {
      // Mark this as a programmatic scroll so the scroll listener doesn't
      // mistake it for the user manually scrolling the pane.
      lastProgrammaticScrollTime = Date.now();
      lineElement.scrollIntoView({ behavior: 'auto', block: 'center' });
    }
  }
}

// Initialize G-code pane after page loads
initGcodePane();

// Jump forward/backward through a sorted list of move indices.
// Returns the target index, or -1 if the list is empty.
function jumpInList(list, forward) {
  if (list.length === 0) return -1;
  const cur = Math.floor(idx) - 1;  // current move index (drawUpTo uses limit-1)
  if (forward) {
    const next = list.find(i => i > cur);
    return next != null ? next + 1 : list[0] + 1;  // wrap around
  } else {
    let prev = -1;
    for (const i of list) { if (i < cur) prev = i; else break; }
    return prev >= 0 ? prev + 1 : list[list.length - 1] + 1;  // wrap around
  }
}

function jumpTo(target) {
  if (target < 0) return;
  idx = target;
  pause();
  if (mode === 'line') { drawUpTo(idx); }
  else { simTime = MOVES[Math.min(MOVES.length-1, Math.max(0, idx-1))].ta; lastFrameMs = null; drawUpToTime(simTime); }
}

window.addEventListener('keydown', (e) => {
  // Don't steal keys while typing in the search/filter fields or using a dropdown
  const tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'l') { jumpTo(jumpInList(limitViolationList, true)); return; }
  if (e.key === 'L') { jumpTo(jumpInList(limitViolationList, false)); return; }
  if (e.key === 'o') { jumpTo(jumpInList(overlapIndices, true)); return; }
  if (e.key === 'O') { jumpTo(jumpInList(overlapIndices, false)); return; }
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    togglePlay();
    return;
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (specialPoints.length === 0) return;
    specialIdx = e.shiftKey
      ? (specialIdx - 1 + specialPoints.length) % specialPoints.length
      : (specialIdx + 1) % specialPoints.length;
    idx = specialPoints[specialIdx];
    pause();
    if (mode === 'line') { drawUpTo(idx); }
    else { simTime = MOVES[Math.min(MOVES.length-1, Math.max(0, idx))].ta; lastFrameMs = null; drawUpToTime(simTime); }
    return;
  }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const fwd = e.key === 'ArrowRight';
  pause();
  if (mode === 'line') {
    idx = Math.max(0, Math.min(MOVES.length, idx + (fwd ? 1 : -1)));
    drawUpTo(idx);
  } else {
    // Step to the next/previous distinct event time
    if (fwd) {
      const nxt = SORTED_TA.find(t => t > simTime + 1e-6);
      if (nxt != null) simTime = nxt;
    } else {
      let prev = 0;
      for (const t of SORTED_TA) { if (t < simTime - 1e-6) prev = t; else break; }
      simTime = prev;
    }
    lastFrameMs = null;
    drawUpToTime(simTime);
  }
});

function redraw() { if (mode === 'line') drawUpTo(idx); else drawUpToTime(simTime); }
window.addEventListener('resize', () => { resize(); redraw(); });
resize();
drawUpTo(0);
requestAnimationFrame(tick);
</script>
